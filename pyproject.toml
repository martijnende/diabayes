[project]
name = "diabayes"
version = "0.2.0"
requires-python = ">= 3.12"
authors = [
    { name = "Martijn van den Ende", email = "martijnende@gmail.com" },
]
dependencies = [
    "jax==0.10.0",
    "jax_tqdm",
    "jaxtyping",
    "equinox==0.13.8",
    "diffrax",
    "optax",
    "optimistix",
    "matplotlib",
    "ipympl",
    "ipython",
    "jupyter",
    "pytest",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
dev = ["black", "isort", "twine"]
gpu = ["jax[cuda12]==0.10.0"]
gui = [
    "click",
    "flask",
    "Flask-Migrate",
    "flask-sqlalchemy",
    "flask-socketio",
    "python-dotenv",
    "bokeh==3.10.0",
]
docs = [
    "make",
    "myst-nb",
    "pydata-sphinx-theme",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-togglebutton",
    "sphinx-design",
    "sphinxcontrib-bibtex",
]

[project.scripts]
diabayes = "diabayes.gui.cli:cli"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["diabayes", "diabayes.gui"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["test"]
pythonpath = ["scripts"]
