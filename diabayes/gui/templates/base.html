<!DOCTYPE html>
<html>
  <head lang="en">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Noitcirf</title>

    <link href="{{ url_for('static', filename='css/bootstrap-5.3.3.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap-icons-1.11.3.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/bootstrap-5.3.3.bundle.min.js') }}" charset="utf-8"></script>
    <script src="{{ url_for('static', filename='js/jquery-3.7.1.min.js') }}" charset="utf-8"></script>
    <script src="{{ url_for('static', filename='js/socket.io-4.0.1.min.js') }}" charset="utf-8"></script>

    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  </head>
  <body class="d-flex flex-column min-vh-100">

    <div class="container">

      <div class="row">
        <div class="col-md-12">
          {% include "menu.html" with context %}
        </div>
      </div>

      <div class="row mt-4">

        <div class="col-xxl-8 col-xl-12">
          <div id="loading-overlay">
            <div class="spinner"></div>
          </div>
          <main id="main-content" class="invisible">
            {% block content %}{% endblock %}
          </main>
        </div>

        <div class="col-xxl-1 col-xl-12 my-4"></div>

        <div class="col-xxl-3 col-xl-12">
          <aside>
            {% include "logger.html" %}
          </aside>
        </div>

      </div>
    </div>

    <footer class="mt-auto">
      <ul>
        <li><a href="" target="_blank">GitHub</a></li>
        <li><a href="" target="_blank">Documentation</a></li>
        <li><a href="" target="_blank">Report an issue</a></li>
        <li><a href="" target="_blank">How to cite</a></li>
      </ul>
    </footer>

  </body>
  {% block javascript %}
  <script src="{{ url_for('static', filename='js/socket-logs.js') }}" charset="utf-8"></script>
  <script src="{{ url_for('static', filename='js/plotly-3.0.1.min.js') }}" charset="utf-8"></script>
  <script src="{{ url_for('static', filename='js/resize-plotly.js') }}" charset="utf-8"></script>
  <script src="{{ url_for('static', filename='js/loading-animation.js') }}" charset="utf-8"></script>
  {% endblock %}
</html>
