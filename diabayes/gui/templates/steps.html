{% for step in vsteps %}
<div class="vstep input-group">

  <form id="form_vstep_{{ step.id }}">

    <!-- Velocity step ID -->
    <input type="hidden" name="id" value="{{ step.id }}" />

    <!-- Start/stop values -->
    <div class="row">

      <div class="col-md-12 d-flex justify-content-center gap-1">

        <!-- Start value -->
        <div class="input-group">
          <!-- <label for="start" class="form-label">Start</label> -->
          <div class="input-group-prepend"><span class="input-group-text">start</span></div>
          <input type="number" class="form-control" placeholder="index" id="start" name="start" min="0" step="1"
            value="{{ step.start }}">
        </div>

        <!-- Stop value -->
        <div class="input-group">
          <div class="input-group-prepend"><span class="input-group-text">stop</span></div>
          <input type="number" class="form-control" placeholder="index" id="stop" name="stop" min="0" step="1"
            value="{{ step.stop }}">
        </div>

      </div>
    </div>
    <!-- End start/stop values -->

    <!-- Velocity values -->
    <div class="row mt-1">

      <div class="col-md-12 d-flex justify-content-center gap-1">

        <!-- v0 -->
        <div class="input-group">
          <div class="input-group-prepend"><span class="input-group-text">v<sub>0</sub></span></div>
          <input type="number" class="form-control" placeholder="[m/s]" id="v0" name="v0" value="{{ step.v0 }}">
        </div>

        <!-- v1 -->
        <div class="input-group">
          <div class="input-group-prepend"><span class="input-group-text">v<sub>1</sub></span></div>
          <input type="number" class="form-control" placeholder="[m/s]" id="v1" name="v1" value="{{ step.v1 }}">
        </div>

      </div>

    </div>
    <!-- End velocity values -->

    <!-- Friction values -->
    <div class="row mt-1">

      <div class="col-md-12 d-flex justify-content-center gap-1">

        <!-- RSF a-value -->
        <div class="input-group">
          <div class="input-group-prepend"><span class="input-group-text">a</span></div>
          <input type="number" class="form-control" placeholder="[-]" name="a" min="0" step="0.001"
            value="{{ step.a }}">
        </div>

        <!-- RSF b-value -->
        <div class="input-group">
          <div class="input-group-prepend"><span class="input-group-text">b</span></div>
          <input type="number" class="form-control" placeholder="[-]" name="b" min="0" step="0.001"
            value="{{ step.b }}">
        </div>

        <!-- RSF Dc-value -->
        <div class="input-group">
          <div class="input-group-prepend"><span class="input-group-text">D<sub>c</sub></span></div>
          <input type="number" class="form-control" placeholder="[m]" name="Dc" min="0" step="0.00001"
            value="{{ step.Dc }}">
        </div>

      </div>

    </div>
    <!-- End friction values -->

    <!-- Other values -->
    <div class="row mt-1">

      <div class="col-md-12 d-flex justify-content-center gap-1">

        <!-- mu0-value -->
        <div class="input-group">
          <div class="input-group-prepend"><span class="input-group-text">&#956;<sub>0</sub></span></div>
          <input type="number" class="form-control" placeholder="[-]" name="mu0" min="0" step="0.01" value="{{ step.mu0 }}">
        </div>

        <!-- Stiffness value -->
        <div class="input-group">
          <div class="input-group-prepend"><span class="input-group-text">k</span></div>
          <input type="number" class="form-control" placeholder="[1/m]" id="k" name="k" min="0" step="100"
            value="{{ step.k }}">
        </div>

      </div>

    </div>
    <!-- End other values -->

    <!-- Update/delete buttons -->
    <div class="row mt-3">

      <div class="col-md-12 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-success action-btn" data-action="update">
          <i class="bi bi-arrow-clockwise"></i> Update
        </button>
        <button type="button" class="btn btn-warning action-btn" data-action="delete">
          <i class="bi bi-trash"></i> Delete
        </button>
      </div>
    </div>
    <!-- End update/delete buttons -->

  </form>
</div>
{% else %}
<div class="no-vstep">Add a velocity step to begin</div>
{% endfor %}
